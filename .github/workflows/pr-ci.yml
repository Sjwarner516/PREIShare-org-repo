# .github/workflows/pr-ci.yml
# Install → typecheck → build → lint → test.
# Script names match package.json (see docs/ci/ci-scripts-notes.md).

name: PR CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

