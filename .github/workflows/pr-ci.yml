# .github/workflows/pr-ci.yml
# Install, typecheck, then build. Lint/test come later (scripts MISSING).
# Script names from docs/ci/project-ci-inventory.md / package.json.

name: PR CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
