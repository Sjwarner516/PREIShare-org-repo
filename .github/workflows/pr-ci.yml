# .github/workflows/pr-ci.yml
# Scaffold only — typecheck/build/lint/test come in later steps.
# Node version and package manager match docs/ci/project-ci-inventory.md
# and docs/ci/pipeline-design.md.

name: PR CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
